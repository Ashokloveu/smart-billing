name: Smart Billing ERP - Production Hardening CI Pipeline

on:
  push:
    branches: [ main, develop, phase-* ]
  pull_request:
    branches: [ main ]

jobs:
  audit_and_security:
    name: Security, Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Backend Dependency Vulnerability Audit
        run: |
          cd backend
          npm audit --audit-level=high

      - name: Frontend Dependency Vulnerability Audit
        run: |
          cd frontend
          npm audit --audit-level=high

  build_and_verify:
    name: TypeScript Build & Regression Invariants
    runs-on: ubuntu-latest
    needs: audit_and_security
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Compile Backend TypeScript (Strict Mode)
        run: |
          cd backend
          npm run build

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile Frontend Production Bundle (Vite)
        run: |
          cd frontend
          npm run build

      - name: Execute Full ERP Regression Invariant Suite
        run: |
          cd backend
          node scripts/verify_invariants.js
          npx tsx scripts/verify_erp_regression.ts
