version: '3.8'

services:
  mongo:
    image: mongo:7.0-jammy
    container_name: smart_billing_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: smart_billing_prod
    volumes:
      - mongo_data:/data/db
      - ./scripts/backup:/backup
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_billing_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_billing_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/smart_billing_prod
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_access_secret_super_secure_32_chars_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_refresh_secret_super_secure_32_chars_long}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    networks:
      - smart_billing_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_billing_frontend
    restart: unless-stopped
    networks:
      - smart_billing_net

  nginx:
    image: nginx:alpine
    container_name: smart_billing_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - smart_billing_net

volumes:
  mongo_data:
    driver: local

networks:
  smart_billing_net:
    driver: bridge
